# ── CI ────────────────────────────────────────────────────────────────────────
# Real Gradle build (the scaffold-era structural check let an AGP-incompatible
# dependency bump merge green — never again). `build` stays the job name so the
# branch-protection required check keeps matching.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # Started by dependency-metadata.yml on the commit it adds to a pull request, which
  # starts no workflow by itself.
  workflow_dispatch:

# A newer push to the same branch or pull request makes an older run of this workflow pointless:
# that run is cancelled. Never on main, where every run stands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build
        run: ./gradlew assembleDebug

      # The variant a release is made from, shrunk by R8 with the rules in app/proguard-rules.pro.
      - name: Build the release variant
        run: ./gradlew assembleRelease

      # The wire classes against answers a running backend gave, the network stack against a
      # local server, the screens' view models: on the JVM, no device needed.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      # Android Lint fails the job on an error or a warning, the versions of libraries aside
      # (lint in app/build.gradle.kts).
      - name: Lint
        run: ./gradlew lintDebug

      - name: Upload the lint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

  # A push to dev of a commit whose dry run passed (this workflow started by hand on a temporary
  # branch, every screens job green): the same code, contract and instance, so its screens are
  # not run again; the build and its checks above are. On every other event, on main, and
  # whenever this job finds nothing or fails, the screens run.
  dry-run:
    name: Screens of a dry run of this commit
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    # Its failure only means the screens run: it does not make the run red.
    continue-on-error: true
    permissions:
      actions: read
    outputs:
      screens: ${{ steps.find.outputs.screens }}
    steps:
      - name: Find a dry run of this commit whose screens passed
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          screens=run
          for run in $(gh api "repos/$REPO/actions/workflows/test.yml/runs?head_sha=$SHA&event=workflow_dispatch&status=success" --jq '.workflow_runs[].id'); do
            green=$(gh api "repos/$REPO/actions/runs/$run/jobs" --jq '[.jobs[] | select(.name | startswith("Screens on")) | select(.conclusion == "success")] | length')
            if [ "$green" -ge 3 ]; then
              screens=passed
              echo "The screens of $SHA passed in https://github.com/$REPO/actions/runs/$run" >> "$GITHUB_STEP_SUMMARY"
              break
            fi
          done
          echo "screens=$screens" >> "$GITHUB_OUTPUT"

  # The screens on an emulator, against a diet-app instance started in the same job from
  # the version contract/ was copied from (contract/diet-app.env), with its catalogue.
  screens:
    name: ${{ matrix.name }}
    needs: dry-run
    if: ${{ !cancelled() && needs.dry-run.outputs.screens != 'passed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Android 14, as most of the phones the app is tried on run.
          - name: Screens on an emulator
            api-level: 34
            artifact: screens
            # A phone's screen under software rendering needs the cores and the memory the Android 17
            # emulator has: with two and the default, the launcher stopped answering and the app's
            # window lost its focus.
            cores: 4
            ram-size: 4096M
            disk-size: ''
            boot-timeout: 600
            emulator-features: ''
            build-type: debug
            variant: Debug
            test-authority: false
            locale: ''
          # Android 17, whose rules the app targets: a server on the local network, such as
          # the emulator's host, needs the permission for nearby devices.
          - name: Screens on Android 17
            api-level: '37.0'
            artifact: screens-android-17
            # Its image takes longer to start and leaves less room for apps: more of the runner's
            # cores, memory, disk and time.
            cores: 4
            ram-size: 4096M
            disk-size: 6G
            boot-timeout: 1200
            # Its graphics driver reads the screen back from the emulator only by DMA, which the
            # emulator offers with direct memory and its shared-slots allocator on; without them
            # surfaceflinger stops on `!hasReadColorBufferDma` and the system starts again under
            # the tests.
            emulator-features: -feature GLDirectMem,HasSharedSlotsHostMemoryAllocator
            build-type: debug
            variant: Debug
            # The instance served over HTTPS as well, with a certificate from an authority made
            # for the run and installed on the emulator as one the user installed.
            test-authority: true
            locale: ''
          # The release build as R8 shrinks it (the `minified` build type): what R8 takes out
          # shows here rather than on a tester's phone. It runs in Polish, the language of the
          # app's testers: every screen a journey keeps a picture of is checked for a word of one
          # letter left loose at a line's end.
          - name: Screens on the release build
            api-level: 34
            artifact: screens-release-build
            cores: 4
            ram-size: 4096M
            disk-size: ''
            boot-timeout: 600
            emulator-features: ''
            build-type: minified
            variant: Minified
            test-authority: false
            locale: pl-PL
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Make room on the runner's disk for the emulator
        run: .github/scripts/make-room-for-the-emulator.sh

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Start diet-app
        run: .github/scripts/start-diet-app.sh "$RUNNER_TEMP/diet-app"

      - name: Serve diet-app over HTTPS with a certificate of a test authority
        if: matrix.test-authority
        run: |
          .github/scripts/serve-with-test-authority.sh "$RUNNER_TEMP/authority"
          echo "TEST_AUTHORITY=$RUNNER_TEMP/authority" >> "$GITHUB_ENV"
          echo "AUTHORITY_ARGUMENT=-Pandroid.testInstrumentationRunnerArguments.userAuthorityServer=https://10.0.2.2:4443/api/" >> "$GITHUB_ENV"

      - name: Build the app and its tests
        run: >-
          ./gradlew -PtestBuildType=${{ matrix.build-type }}
          assemble${{ matrix.variant }} assemble${{ matrix.variant }}AndroidTest

      # The emulator, the instance and the tests share the runner's memory with the build's daemons,
      # whose heaps the build leaves full, R8's above all: the Gradle daemon, and the Kotlin daemon
      # with it, stop before the emulator starts, and the tests' own Gradle compiles nothing.
      - name: Let the build's daemons go
        run: |
          ./gradlew --stop
          free -m

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Emulator 37.2.12 (build 16428233): 37.2.13, on the runners since 2026-10-29, crashes in its
      # OpenGL ES emulation while it cleans up after an app process that ended, and the test
      # orchestrator ends the app's process before every journey. 37.2.12 does not crash, but it
      # never frees what that emulation held for the ended processes: one emulator running every
      # journey filled the runner's memory, so the journeys run in three parts, each on an emulator
      # started afresh.
      - name: Run the screens' tests, part 1 of 3
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          emulator-build: 16428233
          api-level: ${{ matrix.api-level }}
          # A phone's screen, 1080x2400 at 420 dpi (411x914 dp), as the testers' phones have: the
          # default AVD is 320x640 at 160 dpi, narrower than any phone, and its pictures misled. A
          # profile the runner's command-line tools (12.0) know; newer ones (pixel_7a) they do not.
          profile: pixel_6
          cores: ${{ matrix.cores }}
          ram-size: ${{ matrix.ram-size }}
          disk-size: ${{ matrix.disk-size }}
          emulator-boot-timeout: ${{ matrix.boot-timeout }}
          arch: x86_64
          target: google_apis
          # Turned off by settle-emulator.sh, once the settings service answers.
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none ${{ matrix.emulator-features }}
          script: |
            .github/scripts/set-locale.sh "${{ matrix.locale }}"
            .github/scripts/keep-emulator-log.sh
            .github/scripts/settle-emulator.sh
            .github/scripts/install-test-authority.sh
            .github/scripts/wait-for-installs.sh app/build/outputs/apk/${{ matrix.build-type }}/app-${{ matrix.build-type }}.apk net.whiteravens.dietapp
            .github/scripts/wait-for-play-services.sh
            free -m
            ./gradlew -PtestBuildType=${{ matrix.build-type }} $AUTHORITY_ARGUMENT $NOTIFIED_ACCOUNT -Pandroid.testInstrumentationRunnerArguments.numShards=3 -Pandroid.testInstrumentationRunnerArguments.shardIndex=0 connected${{ matrix.variant }}AndroidTest

      - name: Keep the results of part 1
        if: ${{ !cancelled() }}
        run: .github/scripts/keep-part-results.sh 1

      - name: Run the screens' tests, part 2 of 3
        if: ${{ !cancelled() }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          emulator-build: 16428233
          api-level: ${{ matrix.api-level }}
          # A phone's screen, 1080x2400 at 420 dpi (411x914 dp), as the testers' phones have: the
          # default AVD is 320x640 at 160 dpi, narrower than any phone, and its pictures misled. A
          # profile the runner's command-line tools (12.0) know; newer ones (pixel_7a) they do not.
          profile: pixel_6
          cores: ${{ matrix.cores }}
          ram-size: ${{ matrix.ram-size }}
          disk-size: ${{ matrix.disk-size }}
          emulator-boot-timeout: ${{ matrix.boot-timeout }}
          arch: x86_64
          target: google_apis
          # Turned off by settle-emulator.sh, once the settings service answers.
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none ${{ matrix.emulator-features }}
          script: |
            .github/scripts/set-locale.sh "${{ matrix.locale }}"
            .github/scripts/keep-emulator-log.sh
            .github/scripts/settle-emulator.sh
            .github/scripts/install-test-authority.sh
            .github/scripts/wait-for-installs.sh app/build/outputs/apk/${{ matrix.build-type }}/app-${{ matrix.build-type }}.apk net.whiteravens.dietapp
            .github/scripts/wait-for-play-services.sh
            free -m
            ./gradlew -PtestBuildType=${{ matrix.build-type }} $AUTHORITY_ARGUMENT $NOTIFIED_ACCOUNT -Pandroid.testInstrumentationRunnerArguments.numShards=3 -Pandroid.testInstrumentationRunnerArguments.shardIndex=1 connected${{ matrix.variant }}AndroidTest

      - name: Keep the results of part 2
        if: ${{ !cancelled() }}
        run: .github/scripts/keep-part-results.sh 2

      - name: Run the screens' tests, part 3 of 3
        if: ${{ !cancelled() }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          emulator-build: 16428233
          api-level: ${{ matrix.api-level }}
          # A phone's screen, 1080x2400 at 420 dpi (411x914 dp), as the testers' phones have: the
          # default AVD is 320x640 at 160 dpi, narrower than any phone, and its pictures misled. A
          # profile the runner's command-line tools (12.0) know; newer ones (pixel_7a) they do not.
          profile: pixel_6
          cores: ${{ matrix.cores }}
          ram-size: ${{ matrix.ram-size }}
          disk-size: ${{ matrix.disk-size }}
          emulator-boot-timeout: ${{ matrix.boot-timeout }}
          arch: x86_64
          target: google_apis
          # Turned off by settle-emulator.sh, once the settings service answers.
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none ${{ matrix.emulator-features }}
          script: |
            .github/scripts/set-locale.sh "${{ matrix.locale }}"
            .github/scripts/keep-emulator-log.sh
            .github/scripts/settle-emulator.sh
            .github/scripts/install-test-authority.sh
            .github/scripts/wait-for-installs.sh app/build/outputs/apk/${{ matrix.build-type }}/app-${{ matrix.build-type }}.apk net.whiteravens.dietapp
            .github/scripts/wait-for-play-services.sh
            free -m
            ./gradlew -PtestBuildType=${{ matrix.build-type }} $AUTHORITY_ARGUMENT $NOTIFIED_ACCOUNT -Pandroid.testInstrumentationRunnerArguments.numShards=3 -Pandroid.testInstrumentationRunnerArguments.shardIndex=2 connected${{ matrix.variant }}AndroidTest

      - name: Keep the results of part 3
        if: ${{ !cancelled() }}
        run: .github/scripts/keep-part-results.sh 3

      - name: Check that every journey ran
        run: .github/scripts/journeys-ran.sh

      - name: Keep what diet-app logged
        if: always()
        working-directory: ${{ runner.temp }}/diet-app
        run: |
          mkdir -p "$GITHUB_WORKSPACE/app/build"
          docker compose --env-file .env -f docker-compose.yml -f api-port.yml logs --no-color \
            > "$GITHUB_WORKSPACE/app/build/diet-app.log" 2>&1 || true

      # The tests' report, the app's log of every test, the screenshots, the emulator's log and the
      # instance's log.
      - name: Upload what the screens' tests left
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/screens-parts/
            app/build/outputs/connected_android_test_additional_output/
            app/build/emulator-logcat.txt
            app/build/diet-app.log
          if-no-files-found: ignore
          retention-days: 14
