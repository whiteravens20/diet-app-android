# ── CI ────────────────────────────────────────────────────────────────────────
# Real Gradle build (the scaffold-era structural check let an AGP-incompatible
# dependency bump merge green — never again). `build` stays the job name so the
# branch-protection required check keeps matching.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # Started by dependency-metadata.yml on the commit it adds to a pull request, which
  # starts no workflow by itself.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build
        run: ./gradlew assembleDebug

      # The wire classes against answers a running backend gave, the network stack against a
      # local server, the screens' view models: on the JVM, no device needed.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
