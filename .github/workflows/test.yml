# ── CI ────────────────────────────────────────────────────────────────────────
# Real Gradle build (the scaffold-era structural check let an AGP-incompatible
# dependency bump merge green — never again). `build` stays the job name so the
# branch-protection required check keeps matching.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # Started by dependency-metadata.yml on the commit it adds to a pull request, which
  # starts no workflow by itself.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build
        run: ./gradlew assembleDebug

      # The variant a release is made from, shrunk by R8 with the rules in app/proguard-rules.pro.
      - name: Build the release variant
        run: ./gradlew assembleRelease

      # The wire classes against answers a running backend gave, the network stack against a
      # local server, the screens' view models: on the JVM, no device needed.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      # Android Lint fails the job on an error; its warnings are in the report.
      - name: Lint
        run: ./gradlew lintDebug

      - name: Upload the lint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

  # The screens on an emulator, against a diet-app instance started in the same job from
  # the version contract/ was copied from (contract/diet-app.env), with its catalogue.
  screens:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Android 14, as most of the phones the app is tried on run.
          - name: Screens on an emulator
            api-level: 34
            artifact: screens
            cores: 2
            ram-size: ''
            disk-size: ''
            boot-timeout: 600
            build-type: debug
            variant: Debug
            test-authority: false
          # Android 17, whose rules the app targets: a server on the local network, such as
          # the emulator's host, needs the permission for nearby devices.
          - name: Screens on Android 17
            api-level: '37.0'
            artifact: screens-android-17
            # Its image takes longer to start and leaves less room for apps: more of the runner's
            # cores, memory, disk and time.
            cores: 4
            ram-size: 4096M
            disk-size: 6G
            boot-timeout: 1200
            build-type: debug
            variant: Debug
            # The instance served over HTTPS as well, with a certificate from an authority made
            # for the run and installed on the emulator as one the user installed.
            test-authority: true
          # The release build as R8 shrinks it (the `minified` build type): what R8 takes out
          # shows here rather than on a tester's phone.
          - name: Screens on the release build
            api-level: 34
            artifact: screens-release-build
            cores: 2
            ram-size: ''
            disk-size: ''
            boot-timeout: 600
            build-type: minified
            variant: Minified
            test-authority: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Start diet-app
        run: .github/scripts/start-diet-app.sh "$RUNNER_TEMP/diet-app"

      - name: Serve diet-app over HTTPS with a certificate of a test authority
        if: matrix.test-authority
        run: |
          .github/scripts/serve-with-test-authority.sh "$RUNNER_TEMP/authority"
          echo "TEST_AUTHORITY=$RUNNER_TEMP/authority" >> "$GITHUB_ENV"
          echo "AUTHORITY_ARGUMENT=-Pandroid.testInstrumentationRunnerArguments.userAuthorityServer=https://10.0.2.2:4443/api/" >> "$GITHUB_ENV"

      - name: Build the app and its tests
        run: >-
          ./gradlew -PtestBuildType=${{ matrix.build-type }}
          assemble${{ matrix.variant }} assemble${{ matrix.variant }}AndroidTest

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the screens' tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          cores: ${{ matrix.cores }}
          ram-size: ${{ matrix.ram-size }}
          disk-size: ${{ matrix.disk-size }}
          emulator-boot-timeout: ${{ matrix.boot-timeout }}
          arch: x86_64
          target: google_apis
          # Turned off by settle-emulator.sh, once the settings service answers.
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            .github/scripts/keep-emulator-log.sh
            .github/scripts/settle-emulator.sh
            .github/scripts/install-test-authority.sh
            .github/scripts/wait-for-installs.sh app/build/outputs/apk/${{ matrix.build-type }}/app-${{ matrix.build-type }}.apk net.whiteravens.dietapp
            ./gradlew -PtestBuildType=${{ matrix.build-type }} $AUTHORITY_ARGUMENT connected${{ matrix.variant }}AndroidTest

      - name: Keep what diet-app logged
        if: always()
        working-directory: ${{ runner.temp }}/diet-app
        run: |
          mkdir -p "$GITHUB_WORKSPACE/app/build"
          docker compose --env-file .env -f docker-compose.yml -f api-port.yml logs --no-color \
            > "$GITHUB_WORKSPACE/app/build/diet-app.log" 2>&1 || true

      # The tests' report, the app's log of every test, the screenshots, the emulator's log and the
      # instance's log.
      - name: Upload what the screens' tests left
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/
            app/build/emulator-logcat.txt
            app/build/diet-app.log
          if-no-files-found: ignore
          retention-days: 14
