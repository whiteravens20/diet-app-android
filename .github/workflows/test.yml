# ── CI ────────────────────────────────────────────────────────────────────────
# Real Gradle build (the scaffold-era structural check let an AGP-incompatible
# dependency bump merge green — never again). `build` stays the job name so the
# branch-protection required check keeps matching.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew assembleDebug
