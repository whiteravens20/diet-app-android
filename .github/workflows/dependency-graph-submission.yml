# ── Dependency graph submission ───────────────────────────────────────────────
# Sends the graph that Dependency graph wrote to GitHub's dependency graph. It
# runs after that workflow, from the copy of this file on the default branch,
# and runs nothing of the change it was written for: it submits the artifact.
name: Dependency graph submission

on:
  # The default branch's copy runs, with a token that can write the graph. It runs
  # nothing of the change: the action only downloads the graph Dependency graph
  # wrote and submits it.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Dependency graph]
    types: [completed]

permissions: {}

jobs:
  submit:
    name: Submit the dependency graph
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Submit the dependency graph
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          dependency-graph: download-and-submit
