# ── Contract ──────────────────────────────────────────────────────────────────
# Every day, compares the copy of diet-app's contract in contract/ with the one
# on diet-app's dev branch. When they differ, the client's calls are checked
# against dev's, and its texts for refusals against dev's list of codes, to show
# what the change breaks, and the run fails: a change of the backend is seen
# within a day, and the copy is moved on purpose (contract/README.md).
name: Contract

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: Compare with diet-app dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the contract of diet-app's dev
        run: |
          mkdir -p build/dev-contract
          for file in openapi.json errors.json; do
            curl -fsSL "https://raw.githubusercontent.com/whiteravens20/diet-app/dev/docs/api/$file" \
              -o "build/dev-contract/$file"
          done

      - name: Compare it with the copy
        id: compare
        run: |
          if cmp -s contract/openapi.json build/dev-contract/openapi.json &&
            cmp -s contract/errors.json build/dev-contract/errors.json; then
            echo "moved=false" >> "$GITHUB_OUTPUT"
          else
            echo "moved=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 21
        if: steps.compare.outputs.moved == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        if: steps.compare.outputs.moved == 'true'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # A report of what the change breaks, read in the log; the next step fails the run.
      - name: Check the client's calls against diet-app's dev
        if: steps.compare.outputs.moved == 'true'
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --tests '*ContractTest*' --tests '*ErrorTextsTest*' -PcontractDir=build/dev-contract

      - name: Say that the contract moved
        if: steps.compare.outputs.moved == 'true'
        run: |
          echo "::error::diet-app's contract on dev ($(jq -r .info.version build/dev-contract/openapi.json)) differs from the copy in contract/ ($(cat contract/API_VERSION)). Move the copy on purpose: contract/README.md."
          exit 1
