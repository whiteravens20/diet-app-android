name: CodeQL

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # Run weekly on Monday at 08:00 UTC
    - cron: '0 8 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: manual
          queries: security-extended,security-and-quality
          # The project has no Java of its own, and in its Kotlin these two queries find only what
          # the compilers write: the equality of a `data object` and the `$stable` field the
          # Compose compiler gives a class.
          config: |
            query-filters:
              - exclude:
                  id: java/local-variable-is-never-read
              - exclude:
                  id: java/field-masks-super-field

      # CodeQL reads the code as the compilers see it, so every compilation runs here, in
      # Gradle's own process, with nothing taken from a cache.
      - name: Compile the app
        run: >-
          ./gradlew --no-daemon --no-build-cache --no-configuration-cache --rerun-tasks
          -Pkotlin.compiler.execution.strategy=in-process :app:compileDebugSources

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: '/language:${{ matrix.language }}'
