# ── Debug APK on demand ───────────────────────────────────────────────────────
# Manually triggered (Actions → "Build debug APK" → Run workflow, pick the branch —
# normally `dev`). Hands out the debug build as a workflow artifact, for trying the
# app: it is debuggable, talks to a server over plain HTTP as well as HTTPS, logs
# the line of every request it sends, and is signed with a debug key made for this
# run, so it does not install over a copy that another run built. A release build
# comes once a signing key exists (see SECURITY.md).
name: Build debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: assembleDebug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diet-app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
