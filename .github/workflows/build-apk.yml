# ── On-demand APK build ───────────────────────────────────────────────────────
# Manually triggered (Actions → "Build APK" → Run workflow, pick the branch —
# normally `dev`). Produces an unsigned debug APK as a workflow artifact.
# Release signing is out of scope until a signing key exists (see SECURITY.md).
name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: assembleDebug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: diet-app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
