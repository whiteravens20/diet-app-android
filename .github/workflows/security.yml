name: Security

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # Weekly on Monday at 09:00 UTC
    - cron: '0 9 * * 1'

# A newer push to the same branch or pull request makes an older run of this workflow pointless:
# that run is cancelled. Never on main, where every run stands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    # Only runs on pull requests: compares the dependencies a change brings in, from the
    # graph that dependency-graph.yml writes for it.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
          # The graph for the pull request is written and submitted by two other workflows;
          # this waits for it.
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 900
          # The app is AGPL-3.0-only, so a library it ships comes in only under a licence
          # that can be combined with it. One under any other licence fails the review, and
          # is let in by name below once it has been read. The graph marks what the release
          # build ships as runtime; the build's own tools and the tests are development and
          # are not held to this.
          allow-licenses: >-
            0BSD, AGPL-3.0-only, AGPL-3.0-or-later, Apache-2.0, BlueOak-1.0.0,
            BSD-2-Clause, BSD-3-Clause, BSL-1.0, CC-BY-4.0, CC0-1.0,
            GPL-3.0-only, GPL-3.0-or-later, ISC, LGPL-2.1-or-later,
            LGPL-3.0-only, LGPL-3.0-or-later, MIT, MIT-0, MPL-2.0, Python-2.0,
            Unlicense, WTFPL, Zlib

  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The versions the release build ships, taken out of the lockfile, stand in for the
      # lockfiles here. The rest of them are the build's own tools (the test platform, lint,
      # the plugins' classpath), which never reach a phone; the dependency graph reports them.
      - name: Take out the versions the app ships
        run: |
          mkdir -p build/shipped
          { grep '^#' app/gradle.lockfile
            grep -E '=([^=]*,)?releaseRuntimeClasspath(,|$)' app/gradle.lockfile
          } > build/shipped/gradle.lockfile
          echo "$(grep -vc '^#' build/shipped/gradle.lockfile) modules ship in the app"

      - name: Run Trivy on repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          skip-files: app/gradle.lockfile,buildscript-gradle.lockfile,settings-gradle.lockfile
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-fs.sarif
          limit-severities-for-sarif: true
          exit-code: '1'  # Fail the build on HIGH/CRITICAL vulnerabilities

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # Every action in these workflows is pinned to a commit SHA, with its version
  # in a comment. This checks that each SHA is the commit of the version named
  # beside it, so a wrong SHA and a tag moved upstream both fail here.
  pins:
    name: Pinned actions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check each SHA against the tag it names
        run: .github/scripts/verify-pins.sh

  # Dependabot raises no alert for an action pinned by SHA, so this asks GitHub's
  # advisory database about every pinned version in its place.
  actions-audit:
    name: Actions audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Look up each pinned version in the advisory database
        run: .github/scripts/verify-pins.sh --advisories
        env:
          GH_TOKEN: ${{ github.token }}

  # The workflows themselves, read for what makes one unsafe: a checkout's token
  # left behind for later steps, an expression pasted into a script, a condition
  # a bot can be passed off by, a cache a release could be fed from. Findings go
  # to the Security tab beside CodeQL's. Offline: the two jobs above already hold
  # every pin to its tag and to the advisory database. zizmor's own version is
  # named here because the action would otherwise fetch the newest, unsettled;
  # it is moved by hand, with the action.
  zizmor:
    name: Workflow audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # to upload the findings to code scanning

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit the workflows with zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          online-audits: false
