# ── Edge APK on demand ────────────────────────────────────────────────────────
# Manually triggered from `main` (Actions → "Edge APK" → Run workflow): builds the release
# build as Diet App Edge (net.whiteravens.dietapp.edge), the application the testers try
# beside the release, signs it with the edge key and publishes it on the repository's GitHub
# Pages, with its SHA-256, its signer and a provenance attestation. Nothing is built by itself:
# before a round of tests `main` takes `dev`, and this runs on the commit that gives.
#
# Only `main` reaches the key: it is a secret of the `edge` environment, which takes
# deployments from `main` alone. Only a commit whose CI and Security runs passed is built: the
# unit tests, lint, the screens' tests, the Trivy scan of the versions the release build ships
# and the check of the pinned actions.
#
# Its version is `edge-<7-char-sha>`, counted by the commits of `main`, so that each edge build
# installs over the one before it.
name: Edge APK

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the edge APK
    runs-on: ubuntu-latest
    environment: edge
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commits of `main` count the version.
          fetch-depth: 0

      - name: Refuse a commit whose checks did not pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in test.yml security.yml; do
            conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$GITHUB_SHA&event=push&per_page=1" \
              --jq '.workflow_runs[0].conclusion // "none"')
            if [ "$conclusion" != success ]; then
              echo "::error::$workflow has not passed on $GITHUB_SHA (its last run: $conclusion)."
              exit 1
            fi
          done

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Write the edge key
        env:
          EDGE_KEYSTORE_BASE64: ${{ secrets.EDGE_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$EDGE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/edge.p12"

      - name: Build the edge APK
        env:
          EDGE_KEYSTORE: ${{ runner.temp }}/edge.p12
          EDGE_KEYSTORE_PASSWORD: ${{ secrets.EDGE_KEYSTORE_PASSWORD }}
          # The server an edge build starts with, a variable of the `edge` environment: the testers'
          # instance. Without it the build asks for one on its first screen, as a release does.
          EDGE_SERVER: ${{ vars.EDGE_SERVER }}
        run: |
          ./gradlew assembleRelease -Pedge \
            -PappVersionName="edge-${GITHUB_SHA::7}" \
            -PappVersionCode="$(git rev-list --count HEAD)" \
            ${EDGE_SERVER:+"-PapiBaseUrl=$EDGE_SERVER"}

      - name: Remove the edge key
        if: always()
        run: rm -f "$RUNNER_TEMP/edge.p12"

      # The package and the signer read from the APK itself, before anything is published.
      - name: Read the APK
        id: apk
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          package=$("$tools/aapt2" dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          if [ "$package" != net.whiteravens.dietapp.edge ]; then
            echo "::error::The APK is $package, not net.whiteravens.dietapp.edge."
            exit 1
          fi
          # apksigner names the signer "Signer #1" up to build-tools 36, and by its scheme from 37 on ("V2 Signer:").
          signer=$("$tools/apksigner" verify --print-certs "$apk" | sed -n -E 's/^(Signer #1|V[0-9.]+ Signer:) certificate SHA-256 digest: //p' | head -1)
          if [ -z "$signer" ]; then
            echo "::error::No signer could be read from the APK."
            exit 1
          fi
          echo "signer=$signer" >> "$GITHUB_OUTPUT"

      - name: Lay out the page
        env:
          SIGNER: ${{ steps.apk.outputs.signer }}
          EDGE_SERVER: ${{ vars.EDGE_SERVER }}
        run: |
          .github/scripts/edge-page.sh app/build/outputs/apk/release/app-release.apk site \
            "edge-${GITHUB_SHA::7}" "$(git rev-list --count HEAD)" "$GITHUB_SHA" "$SIGNER" "${EDGE_SERVER:+preset}"

      - name: Attest where the APK comes from
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: site/diet-app-edge.apk

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Publish on GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
