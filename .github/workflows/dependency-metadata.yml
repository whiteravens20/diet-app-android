# ── Dependency metadata ───────────────────────────────────────────────────────
# The build checks every file it downloads against gradle/verification-metadata.xml
# and resolves only the versions in the lockfiles, so a Dependabot update of a
# Gradle dependency fails CI until both are written again. This workflow writes
# them for such a pull request and commits them to its branch.
#
# The update's code never runs with a token that can write. The first job builds
# the pull request with read access only and hands on what it wrote as an
# artifact. The second runs nothing from the pull request: it takes the metadata,
# the keyring and the lockfiles, nothing else, and commits them through the API,
# signed by GitHub. A change to the signing keys the build trusts is not committed
# on its own: the run fails and shows the change, and once someone has read who
# holds the keys, they run this workflow by hand with accept-keys. A commit made
# with this token starts no workflow, so the second job starts CI on it.
name: Dependency metadata

on:
  pull_request:
    branches: [dev]
    paths:
      - gradle/libs.versions.toml
      - gradle/wrapper/gradle-wrapper.properties
      - '**/*.gradle.kts'
  workflow_dispatch:
    inputs:
      pr:
        description: Number of the pull request
        required: true
        type: number
      accept-keys:
        description: Commit a change to the signing keys (read who holds them first)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: dependency-metadata-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  write:
    name: Write the metadata
    if: github.event_name == 'workflow_dispatch' || github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head: ${{ steps.pr.outputs.head }}
      changed: ${{ steps.collect.outputs.changed }}
    steps:
      - name: Find the pull request's head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid,isCrossRepository \
            --jq '"head=\(.headRefOid)", "fork=\(.isCrossRepository)"' >> "$GITHUB_OUTPUT"

      - name: Leave a pull request from a fork to its author
        if: steps.pr.outputs.fork == 'true'
        run: |
          echo "::error::The pull request comes from a fork: its author writes the metadata (CONTRIBUTING.md)."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.head }}
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      # The tasks CI runs, so that everything they download is recorded, the screens' tests of
      # both build types they run on included. Keys the keyring does not have yet are fetched
      # from the key servers.
      - name: Write the metadata and the lockfiles
        run: |
          ./gradlew --write-verification-metadata sha256,pgp --export-keys --write-locks \
            assembleDebug assembleDebugAndroidTest testDebugUnitTest lintDebug
          ./gradlew -PtestBuildType=minified --write-verification-metadata sha256,pgp --export-keys --write-locks \
            assembleMinifiedAndroidTest :app:dependencies --configuration minifiedAndroidTestLintChecksClasspath

      - name: Collect what changed
        id: collect
        run: |
          git status --short
          mkdir "$RUNNER_TEMP/written"
          git ls-files --modified --others --exclude-standard -- \
            gradle/verification-metadata.xml gradle/verification-keyring.keys '*.lockfile' |
            while read -r file; do cp --parents "$file" "$RUNNER_TEMP/written/"; done
          if [ -n "$(ls -A "$RUNNER_TEMP/written")" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.collect.outputs.changed == 'true'
        with:
          name: dependency-metadata
          path: ${{ runner.temp }}/written
          retention-days: 7

  commit:
    name: Commit it to the pull request
    needs: write
    if: needs.write.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number || inputs.pr }}
    steps:
      - name: Find the pull request's branch
        id: pr
        run: |
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefName,headRefOid,isCrossRepository \
            --jq '"branch=\(.headRefName)", "head=\(.headRefOid)", "fork=\(.isCrossRepository)"' >> "$GITHUB_OUTPUT"

      - name: Stop if the pull request moved
        if: steps.pr.outputs.fork == 'true' || steps.pr.outputs.head != needs.write.outputs.head
        run: |
          echo "::error::The pull request's head is no longer the commit the metadata was written for. Run this workflow again."
          exit 1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dependency-metadata
          path: ${{ runner.temp }}/written

      # What the first job handed on was written by the update's code: only these files are
      # taken, and a change to the keys waits for someone who has read it.
      - name: Check what is to be committed
        working-directory: ${{ runner.temp }}/written
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head }}
          ACCEPT_KEYS: ${{ inputs.accept-keys == true }}
        run: |
          set -euo pipefail
          find . -mindepth 1 ! -type d -printf '%P\n' | sort > "$RUNNER_TEMP/files"
          while read -r file; do
            case "$file" in
              gradle/verification-metadata.xml | gradle/verification-keyring.keys | \
              buildscript-gradle.lockfile | settings-gradle.lockfile | app/gradle.lockfile) ;;
              *) echo "::error::$file is not a file this workflow commits."; exit 1 ;;
            esac
            if [ -L "$file" ] || [ ! -f "$file" ]; then
              echo "::error::$file is not a regular file."
              exit 1
            fi
          done < "$RUNNER_TEMP/files"

          at_head() {
            gh api "repos/$GITHUB_REPOSITORY/contents/$1?ref=$HEAD_SHA" -H 'Accept: application/vnd.github.raw'
          }
          trust() { sed -n '/<configuration>/,/<\/configuration>/p'; }
          holders() { grep -E '^(pub|uid) ' || true; }
          : > "$RUNNER_TEMP/keys.diff"
          if [ -f gradle/verification-metadata.xml ]; then
            diff -u --label "metadata at the head" --label "metadata written for the update" \
              <(at_head gradle/verification-metadata.xml | trust) \
              <(trust < gradle/verification-metadata.xml) >> "$RUNNER_TEMP/keys.diff" || true
          fi
          if [ -f gradle/verification-keyring.keys ] &&
            ! at_head gradle/verification-keyring.keys | cmp -s - gradle/verification-keyring.keys; then
            diff -u --label "keyring at the head" --label "keyring written for the update" \
              <(at_head gradle/verification-keyring.keys | holders) \
              <(holders < gradle/verification-keyring.keys) >> "$RUNNER_TEMP/keys.diff" || true
            echo "The keyring changed." >> "$RUNNER_TEMP/keys.diff"
          fi
          if [ -s "$RUNNER_TEMP/keys.diff" ] && [ "$ACCEPT_KEYS" != "true" ]; then
            {
              echo "## The update changes the signing keys the build trusts"
              echo
              echo "Read who holds each new key, then run this workflow by hand for pull request #$PR with accept-keys."
              echo
              echo '```diff'
              cat "$RUNNER_TEMP/keys.diff"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::The update changes the signing keys the build trusts: the run's summary shows how."
            exit 1
          fi

      - name: Commit the files to the pull request's branch
        working-directory: ${{ runner.temp }}/written
        env:
          BRANCH: ${{ steps.pr.outputs.branch }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
        run: |
          set -euo pipefail
          while read -r file; do
            jq -n --arg path "$file" --rawfile contents <(base64 -w0 "$file") \
              '{path: $path, contents: $contents}'
          done < "$RUNNER_TEMP/files" | jq -s . > "$RUNNER_TEMP/additions.json"
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg branch "$BRANCH" --arg head "$HEAD_SHA" \
            --slurpfile additions "$RUNNER_TEMP/additions.json" '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                expectedHeadOid: $head,
                message: {headline: "chore(deps): write the dependency metadata and lockfiles again"},
                fileChanges: {additions: $additions[0]}
              }}
            }' > "$RUNNER_TEMP/commit.json"
          gh api graphql --input "$RUNNER_TEMP/commit.json" --jq '.data.createCommitOnBranch.commit.oid'

      - name: Start CI on the new commit
        env:
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: gh workflow run test.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
