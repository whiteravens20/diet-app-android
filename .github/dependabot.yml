# ── Dependabot ────────────────────────────────────────────────────────────────
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: UTC
    labels: [dependencies, github-actions]
    commit-message:
      prefix: "ci"

  - package-ecosystem: gradle
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: UTC
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    groups:
      non-breaking:
        update-types: [minor, patch]
