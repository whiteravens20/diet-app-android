# ── Dependabot ────────────────────────────────────────────────────────────────
version: 2

updates:
  - package-ecosystem: github-actions
    # Let a newly published version settle for a week before proposing it. A
    # release can be yanked or a tag repointed in the hours after it lands, and
    # none of these bumps is urgent. Dependabot security updates are exempt
    # from cooldown and still open the moment an advisory lands.
    cooldown:
      default-days: 7
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: UTC
    labels: [dependencies, github-actions]
    commit-message:
      prefix: "ci"

  - package-ecosystem: gradle
    # Let a newly published version settle for a week before proposing it. A
    # release can be yanked or a tag repointed in the hours after it lands, and
    # none of these bumps is urgent. Dependabot security updates are exempt
    # from cooldown and still open the moment an advisory lands.
    cooldown:
      default-days: 7
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: UTC
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    groups:
      non-breaking:
        update-types: [minor, patch]
