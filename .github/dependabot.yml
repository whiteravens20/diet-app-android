# ── Dependabot ────────────────────────────────────────────────────────────────
# No pull request is rebased by itself (`rebase-strategy: disabled`): a push to
# `dev` would otherwise rebase every open one and run its checks again. One is
# rebased when it is next to be merged, with a `@dependabot rebase` comment.
version: 2

updates:
  - package-ecosystem: github-actions
    # Let a newly published version settle for a week before proposing it. A
    # release can be yanked or a tag repointed in the hours after it lands, and
    # none of these bumps is urgent. Dependabot security updates are exempt
    # from cooldown and still open the moment an advisory lands.
    cooldown:
      default-days: 7
    directory: /
    target-branch: dev
    rebase-strategy: disabled
    schedule:
      interval: monthly
      time: "08:00"
      timezone: UTC
    labels: [dependencies, github-actions]
    commit-message:
      prefix: "ci"
    # Minor and patch bumps come as one pull request, a major on its own, so the
    # parts of one action (codeql-action's init, analyze and upload-sarif) move
    # together.
    groups:
      actions-non-breaking:
        update-types: [minor, patch]

  - package-ecosystem: gradle
    # Let a newly published version settle for a week before proposing it. A
    # release can be yanked or a tag repointed in the hours after it lands, and
    # none of these bumps is urgent. Dependabot security updates are exempt
    # from cooldown and still open the moment an advisory lands.
    cooldown:
      default-days: 7
    directory: /
    target-branch: dev
    rebase-strategy: disabled
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: UTC
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    groups:
      non-breaking:
        update-types: [minor, patch]
